  tb.append(body);
  root.append(h('section', null, h('h2', null, t('measurements')), tb));
  root.append(h('p', { class: 'foot' }, t('report_foot')));
  return root;
}
function buildRouteReport() {
  const sums = summaries();
  const root = h('div');
  root.append(reportHeader(t('report_route'), dateLabel(Date.now())));
  const today = startOfToday();
  const counts = { good: 0, warning: 0, serious: 0, critical: 0, none: 0 };
  for (const mc of db.machines) { const s = sums.get(mc.id); if (!s.last) counts.none++; else counts[['good', 'warning', 'serious', 'critical'][s.rank]]++; }
  const done = db.machines.filter((m) => { const s = sums.get(m.id); return s.last && s.last.time >= today; }).length;
  const kv = (label, value) => h('div', null, h('span', null, label), h('b', null, value));
  root.append(h('div', { class: 'kv' },
    kv(t('machines_title'), numEl(String(db.machines.length))), kv(t('route_today'), numEl(done + ' / ' + db.machines.length)),
    kv(t('zoneC_t'), numEl(String(counts.warning + counts.serious))), kv(t('zoneD_t'), numEl(String(counts.critical)))));
  const tb = h('table', null, h('thead', null, h('tr', null, ...[t('machine'), t('location'), t('col_date'), t('col_val'), t('status'), t('col_change'), t('hints')].map((x) => h('th', null, x)))));
  const body = h('tbody');
  for (const mc of db.machines.slice().sort((a, b) => sums.get(b.id).rank - sums.get(a.id).rank || byName(a, b))) {
    const s = sums.get(mc.id);
    if (!s.last) { body.append(h('tr', null, h('td', null, mc.name), h('td', null, mc.location || ''), h('td', { colspan: 5 }, t('not_measured')))); continue; }
    const res = measAnalysis(s.last, mc, s.base);
    const top = res.items.find((it) => it.key !== 'h_rise') || res.items[0];
    body.append(h('tr', null, h('td', null, mc.name), h('td', null, mc.location || ''), h('td', null, dateTime(s.last.time)),
      h('td', null, numEl(fmt(s.last.vel, 2))), h('td', null, zoneChip(s.z, true, true)),
      h('td', null, s.ch ? changeChip(s.ch, true) : '—'), h('td', null, top ? t(top.key + '_t', top.vars) : '')));
  }
  tb.append(body);
  root.append(h('section', null, h('h2', null, t('summary')), tb));
  root.append(h('p', { class: 'foot' }, t('report_foot')));
  return root;
}
function printReport(el, name) {
  const box = $('#report');
  box.textContent = '';
  box.append(el);
  box.dir = document.documentElement.dir;
  const title = document.title;
  // the print dialog suggests the page title as the PDF file name
  document.title = 'MANTIS - ' + (name || t('report_route')) + ' - ' + new Date().toISOString().slice(0, 10);
  const restoreTitle = () => { document.title = title; window.removeEventListener('afterprint', restoreTitle); };
  window.addEventListener('afterprint', restoreTitle);
  window.print();
}

// ------------------------------------------------------------- routing ---
function route() {
  const [tab, sub] = location.hash.slice(1).split('/');
  state.tab = TABS.includes(tab) ? tab : 'live';
  state.machineView = state.tab === 'machines' && sub ? decodeURIComponent(sub) : null;
  if (state.machineView && !machineById(state.machineView)) state.machineView = null;
  if (!state.machineView) state.pushedDetail = false;
  for (const p of document.querySelectorAll('.panel')) p.hidden = p.dataset.tab !== state.tab;
  machSig = '';
  clearHover();
  scheduleRender();
}
// tab switches replace the history entry (back leaves the app as usual);
// opening a machine pushes one, so back returns to the list
function go(hash, push) {
  if (push) { state.pushedDetail = true; location.hash = hash; window.scrollTo(0, 0); return; }
  history.replaceState(null, '', '#' + hash);
  route();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

// ----------------------------------------------------------- settings ---
function applyLang() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-title]')) {
    el.title = t(el.dataset.i18nTitle);
    el.setAttribute('aria-label', el.title);
  }
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
  for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
  for (const b of document.querySelectorAll('.seg[data-setting="dur"] button')) b.textContent = t('sec', { n: b.dataset.v });
  $('#btnLang').textContent = state.lang === 'ar' ? 'EN' : 'ع';
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  $('#browserNote').textContent = navigator.bluetooth ? t('browser_ok') : t(ios ? 'no_ble_ios' : 'no_ble');
  for (const b of document.querySelectorAll('[data-act="usb"]')) b.hidden = !navigator.serial;
  inspectSig = selSig = machSig = histSig = '';
  scheduleRender();
}
function applyTheme() {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
}
function setSetting(k, v) {
  if (k === 'lang') { state.lang = v; store.set('lang', v); applyLang(); return; }
  if (k === 'theme') { state.theme = v; store.set('theme', v); applyTheme(); scheduleRender(); return; }
  state.settings[k] = v;
  store.set('settings', state.settings);
  if (k === 'wake') updateWakeLock();
  if (k === 'beep' && v) beep(3);
  inspectSig = '';
  scheduleRender();
}

// ------------------------------------------------------------ wiring ---
const ACTS = { ble: () => connectBle(false), usb: connectUsb, demo: startDemo, help: showHelp, disconnect };
for (const b of document.querySelectorAll('[data-act]')) b.onclick = ACTS[b.dataset.act];
for (const a of document.querySelectorAll('[data-nav]')) a.onclick = (e) => { e.preventDefault(); go(a.dataset.nav); };
$('#btnConnect').onclick = () => connectBle(false);
$('#btnUsb').onclick = connectUsb;
$('#btnDisconnect').onclick = disconnect;
$('#connPill').onclick = () => go('device');
$('#liveMini').onclick = () => go('live');
$('#btnBleAll').onclick = () => { closeHelp(); connectBle(true); };
$('#btnHelpRetry').onclick = () => { closeHelp(); connectBle(false); };
$('#helpClose').onclick = closeHelp;
$('#btnLang').onclick = () => setSetting('lang', state.lang === 'ar' ? 'en' : 'ar');
$('#btnTheme').onclick = () => {
  const dark = state.theme === 'dark' || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  setSetting('theme', dark ? 'light' : 'dark');
};
for (const g of document.querySelectorAll('.seg[data-setting]')) {
  g.onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const k = g.dataset.setting;
    setSetting(k, k === 'dur' || k === 'lineHz' ? +b.dataset.v : b.dataset.v);
  };
}
for (const el of document.querySelectorAll('input[data-setting]')) el.onchange = () => setSetting(el.dataset.setting, el.checked);
$('#isoClass').onchange = (e) => {
  state.isoClass = +e.target.value;
  store.set('cls', state.isoClass);
  const mc = machineById(state.machineId);
  if (mc) { mc.cls = state.isoClass; saveDb(); }
  state.reportedZone = zoneOf((state.readings[state.readings.length - 1] || {}).vel);
  addEvent('good', 'i', 'ev_cls', { clsN: state.isoClass });
  sendCommand([1, state.isoClass]);
};
$('#machineSel').onchange = (e) => {
  const v = e.target.value;
  if (v === '__new') {
    e.target.value = machineById(state.machineId) ? state.machineId : '';
    openMachineDialog(null, (m) => selectMachine(m.id));
  } else selectMachine(v || null);
};
$('#btnAddMachine').onclick = () => openMachineDialog(null, (m) => selectMachine(m.id));
$('#btnNewMachine').onclick = () => openMachineDialog(null, (m) => go('machines/' + m.id, true));
$('#btnRouteReport').onclick = () => printReport(buildRouteReport());
$('#btnRouteShare').onclick = () => shareText(routeSummaryText(), 'MANTIS · ' + t('report_route'));
$('#machSearch').oninput = (e) => { state.search = e.target.value; scheduleRender(); };
$('#rpmInput').onchange = (e) => {
  const v = parseInt(e.target.value, 10);
  const rpm = v >= 60 && v <= 30000 ? v : null;
  const mc = machineById(state.machineId);
  if (mc) { mc.rpm = rpm; saveDb(); } else { state.rpmManual = rpm; store.set('rpm', rpm); }
  scheduleRender();
};
$('#btnUseDom').onclick = () => {
  const r = state.readings[state.readings.length - 1];
  if (!r || !r.f) return;
  $('#rpmInput').value = Math.round(r.f * 60);
  $('#rpmInput').onchange({ target: $('#rpmInput') });
};
$('#rangeSeg').onclick = (e) => {
  const m = e.target.dataset && e.target.dataset.m;
  if (!m) return;
  state.rangeMin = +m;
  store.set('range', state.rangeMin);
  scheduleRender();
};
for (const g of document.querySelectorAll('.seg[data-view]')) {
  g.onclick = (e) => {
    if (!e.target.dataset.v) return;
    state.view[g.dataset.view] = e.target.dataset.v;
    scheduleRender();
  };
}
$('#btnIdentify').onclick = () => { sendCommand([2]); toast(t('identify_sent')); };
$('#btnExport').onclick = exportCsv;
$('#btnExportMeas').onclick = exportMeasCsv;
$('#btnBackup').onclick = backup;
$('#btnRestore').onclick = () => $('#fileRestore').click();
$('#fileRestore').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) restore(f); };
$('#btnFirstReading').onclick = () => {
  if (state.firstReading || state.firstReadingPending || state.conn !== 'live' || Date.now() - state.lastRx > 5000 || !['ble', 'usb'].includes(state.source)) return;
  state.firstReadingPending = true;
  state.firstReadingStarted = Date.now();
  scheduleRender();
};
$('#btnClear').onclick = () => {
  state.readings = state.readings.slice(-1);
  state.events = [];
  toast(t('cleared'));
  scheduleRender();
};
bindSpecHover($('#specChart'));
bindLineHover($('#trendChart'), 'trend', (p) => clock(p.time) + ' · ' + zoneName(zoneOf(p.vel)));
new ResizeObserver(() => scheduleRender()).observe($('main'));
new IntersectionObserver(([e]) => { state.heroVisible = e.isIntersecting; scheduleRender(); },
  { rootMargin: '-100px 0px 0px 0px', threshold: 0.3 }).observe($('#heroCard'));
setInterval(() => { if (state.source || state.tab === 'machines') scheduleRender(); }, 1000);
window.addEventListener('afterprint', () => { $('#report').textContent = ''; });

// offline support once published (https only; localhost is for development)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

applyTheme();
applyLang();
route();
autoConnect();
</script>
</body>
</html>
